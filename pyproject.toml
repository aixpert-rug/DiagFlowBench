[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diagflowbench"
version = "0.1.0"
description = "DiagFlowBench: Evaluating How Language Models Handle Off-Procedure Inputs in Grounded Diagnostic Dialogue"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Guillermo Gil de Avalle", email = "aggildeavalle@gmail.com"},
]
keywords = ["benchmark", "procedural-knowledge", "llm-evaluation", "diagnostic-troubleshooting", "flowcharts", "emnlp"]

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "nltk>=3.8",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "tqdm>=4.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
